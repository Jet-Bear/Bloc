name: Report a problem
description: Something in Bloc doesn't work as it should.
body:
  - type: textarea
    id: que
    attributes:
      label: What happened, and what were you doing?
      description: Don't paste private text from your documents.
    validations:
      required: true
  - type: textarea
    id: datos
    attributes:
      label: Technical details
      description: Bloc fills this in when you use File › Report a problem. It never includes document text, file names or paths.
      render: markdown
    validations:
      required: false
